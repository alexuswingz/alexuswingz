<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Alexus Karl Joaquin, Senior Full Stack Lead Engineer">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#8FE6AE" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#8FE6AE" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8FE6AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE6AE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FE6AE" stop-opacity="1"/>
      <stop offset="1" stop-color="#8FE6AE" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0b0d0c"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#sweep)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="'Inter Tight','Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="64" y="92" font-size="13" letter-spacing="3.5" fill="#8FE6AE" font-weight="600">SENIOR FULL STACK LEAD ENGINEER</text>
    <text x="62" y="162" font-size="62" font-weight="700" fill="#F3F5F2" letter-spacing="-1.5">Alexus Karl Joaquin</text>
    <text x="64" y="205" font-size="21" fill="#A7AFAA">I take products from a blank repo to paying users.</text>
    <text x="64" y="236" font-size="16" fill="#6F7873">Python · React · TypeScript · Rails · AWS · iOS (Capacitor) · MCP &amp; AI-native teams</text>

    <g transform="translate(64 268)" font-size="13" font-weight="600" letter-spacing="0.3">
      <rect width="118" height="30" rx="15" fill="#8FE6AE" fill-opacity="0.12" stroke="#8FE6AE" stroke-opacity="0.35"/>
      <text x="59" y="20" text-anchor="middle" fill="#8FE6AE">Philippines</text>
      <rect x="128" width="138" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="197" y="20" text-anchor="middle" fill="#C9CFCB">Remote-first</text>
      <rect x="276" width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="374" y="20" text-anchor="middle" fill="#C9CFCB">Open to senior / lead roles</text>
    </g>

    <g transform="translate(804 56)">
      <rect width="332" height="228" rx="18" fill="#121514" stroke="#ffffff" stroke-opacity="0.08"/>
      <g font-weight="700" fill="#F3F5F2" font-size="34" letter-spacing="-1">
        <text x="28" y="60">8+</text>
        <text x="190" y="60">4+</text>
        <text x="28" y="160">8</text>
        <text x="190" y="160">1</text>
      </g>
      <g fill="#8A938E" font-size="12.5" letter-spacing="0.2">
        <text x="28" y="82">years engineering</text>
        <text x="190" y="82">years leading teams</text>
        <text x="28" y="182">products shipped solo,</text>
        <text x="28" y="199">zero to deploy</text>
        <text x="190" y="182">paid app live on</text>
        <text x="190" y="199">the App Store</text>
      </g>
      <line x1="28" y1="112" x2="304" y2="112" stroke="#ffffff" stroke-opacity="0.08"/>
      <line x1="166" y1="36" x2="166" y2="204" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
  </g>
</svg>
